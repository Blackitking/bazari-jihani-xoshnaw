<script>

const SUPABASE_URL =
"https://wpjqvpcqaufrpstnziad.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9ALxJWahJqUFvtMXR7-5TA_XHBIF6ZK";

"lawaking24@gmail.com";

const supabaseClient =
window.supabase.createClient(

let currentUser=null;

/* =========================
ADMIN
========================= */

function isAdmin(){

return !!(
currentUser &&
currentUser.email &&
currentUser.email.toLowerCase() ===
ADMIN_EMAIL.toLowerCase()
);

}


/* =========================
ESCAPE
========================= */

function escapeHTML(value){

if(value===null || value===undefined)
return "";

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
PLAN DAYS
========================= */

function getPlanDays(plan){

if(plan==="هەفتانە") return 7;
if(plan==="مانگانە") return 30;
if(plan==="ساڵانە") return 365;

return 7;

}

HEADER
========================= */

document.getElementById("authButtons");

const logoutArea =
document.getElementById("logoutArea");

authButtons.style.display="none";

/* =========================
ENSURE PROFILE
========================= */

async function ensureProfile(){

if(!currentUser)
return null;


/*
سەرەتا profile ـەکە بخوێنەوە
*/

const {data,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(!error && data){

currentProfile=data;

return data;

}


/*
ئەگەر profile نەبوو
IMPORTANT:
phone لێرە نییە چونکە
profiles.phone نییە
*/

const name =
currentUser.user_metadata?.full_name ||
"";

const {error:newError} =
await supabaseClient
.from("profiles")
.upsert({

id:currentUser.id,

full_name:name,

is_admin:isAdmin(),

premium_active:false

},{
onConflict:"id"
});

if(newError){

console.error(
"PROFILE CREATE ERROR:",
newError
);

currentProfile=null;

return null;

}


/*
دووبارە profile بخوێنەوە
*/

const {data:createdProfile,error:readError} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(readError){

console.error(
"PROFILE READ ERROR:",
readError
);

currentProfile=null;

return null;

}

currentProfile=createdProfile;

return createdProfile;

}


/* =========================
LOAD PROFILE
========================= */

async function loadProfile(){

if(!currentUser)
return null;

return await ensureProfile();

}


/* =========================
REGISTER
========================= */

async function registerUser(){

const name =
document.getElementById("regName")
.value.trim();

const phone =
document.getElementById("regPhone")
.value.trim();

const email =
document.getElementById("regEmail")
.value.trim();

const password =
document.getElementById("regPassword")
.value;

if(!name || !phone || !email || !password){

alert(
"❌ تکایە هەموو خانەکان پڕ بکەرەوە."
);

return;

}

if(password.length<6){

alert(
"❌ وشەی نهێنی دەبێت لانیکەم 6 پیت بێت."
);

return;

}

try{

const {data,error} =
await supabaseClient.auth.signUp({

email,
password,

options:{
data:{
full_name:name,
phone:phone
}
}

});

if(error){

alert(
"❌ تۆمارکردن سەرکەوتوو نەبوو:\n\n"+
error.message
);

return;

}

if(data.user){

/*
phone تەنها لە Auth Metadata ـە.
لە profiles ناینووسین.
*/

const {error:profileError} =
await supabaseClient
.from("profiles")
.upsert({

id:data.user.id,

full_name:name,

is_admin:false,

premium_active:false

},{
onConflict:"id"
});

if(profileError){

console.error(
"PROFILE REGISTER ERROR:",
profileError
);

}

}

alert(
"✅ ئەکاونتەکەت دروست کرا.\n\nئێستا Login بکە."
);

closeAll();

}catch(error){

alert(
"❌ هەڵەیەک ڕوویدا:\n\n"+
(error.message || error)
);

}

}


/* =========================
LOGIN
========================= */

async function loginUser(){

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

if(!email || !password){

alert(
"❌ تکایە ئیمەیڵ و وشەی نهێنی بنووسە."
);

return;

}

try{

const {data,error} =
await supabaseClient.auth
.signInWithPassword({

email,
password

});

if(error){

alert(
"❌ Login سەرکەوتوو نەبوو:\n\n"+
error.message
);

return;

}

currentUser=data.user;

await loadProfile();

updateHeader();

closeAll();

await showDashboard();

}catch(error){

alert(
"❌ هەڵەیەک ڕوویدا:\n\n"+
(error.message || error)
);

}

}


/* =========================
DASHBOARD
========================= */

async function showDashboard(){

if(!currentUser)
return;

await loadProfile();

.style.display="block";

const name =
currentProfile?.full_name ||
currentUser.user_metadata?.full_name ||
currentUser.email;

document.getElementById("dashboardName")
.textContent="سڵاو "+name;


/* ADMIN */

if(isAdmin()){

document.getElementById("adminBox")
.style.display="block";

await loadAdminRequests();

}else{

document.getElementById("adminBox")
.style.display="none";

}


/* PREMIUM */

const status =
document.getElementById("premiumStatus");

const plan =
document.getElementById("dashboardPlan");

if(
currentProfile &&
currentProfile.premium_active===true
){

status.className="status active";

status.innerHTML =
"👑 Premium ـەکەت چالاکە.";

plan.innerHTML =
"<p><strong>پلان:</strong> "+
escapeHTML(
currentProfile.premium_plan || ""
)+
"</p>";

}else{

status.className="status pending";

status.innerHTML =
"Premium هێشتا چالاک نەکراوە.";

plan.innerHTML="";

}


/* PAYMENTS */

if(!isAdmin())
await loadMyPayments();
else
document.getElementById("myPayments").innerHTML="";

}


/* =========================
ADMIN REQUESTS
========================= */

async function loadAdminRequests(){

if(!isAdmin())
return;

const box =
document.getElementById("adminRequests");

box.innerHTML =
"⏳ داواکارییەکان بار دەکرێن...";

const {data,error} =
await supabaseClient
.from("payment_requests")
.select("*")
.order(
"created_at",
{ascending:false}
);

if(error){

console.error(error);

box.innerHTML =
"<div class='empty'>❌ هەڵە:<br>"+
escapeHTML(error.message)+
"</div>";

return;

}

if(!data || data.length===0){

box.innerHTML =
"<div class='empty'>📭 هیچ داواکارییەک نییە.</div>";

return;

}

let html="";

data.forEach(item=>{

const created =
item.created_at
?
new Date(item.created_at)
.toLocaleString("ku-IQ")
:
"";

let statusText="⏳ چاوەڕوان";

if(item.status==="accepted")
statusText="✅ پەسەندکراو";

if(item.status==="rejected")
statusText="❌ ڕەتکراوە";

html +=
"<div class='admin-request'>"+

"<strong>👤 User ID:</strong><br>"+
escapeHTML(item.user_id)+
"<br><br>"+

"<strong>👑 پلان:</strong> "+
escapeHTML(item.plan || "")+
"<br>"+

"<strong>💰 بڕ:</strong> "+
escapeHTML(item.amount || "")+
" د.ع<br>"+

"<strong>📅 کات:</strong> "+
escapeHTML(created)+
"<br>"+

"<strong>📌 دۆخ:</strong> "+
statusText+
"<br>";

if(item.receipt_url){

html +=
"<a class='receipt-btn' href='"+
escapeHTML(item.receipt_url)+
"' target='_blank'>"+
"📷 بینینی وەسڵ"+
"</a>";

}

if(item.status==="pending"){

html +=

"<div style='margin-top:10px'>"+

"<button class='accept-btn' onclick=\"acceptPayment('"+
escapeHTML(item.id)+
"','"+
escapeHTML(item.user_id)+
"','"+
escapeHTML(item.plan)+
"')\">"+
"✅ پەسەندکردن"+
"</button>"+

"<button class='reject-btn' onclick=\"rejectPayment('"+
escapeHTML(item.id)+
"')\">"+
"❌ ڕەتکردنەوە"+
"</button>"+

"</div>";

}

html+="</div>";

});

box.innerHTML=html;

}


/* =========================
ACTIVATE USER PREMIUM
========================= */

async function activateUserPremium(
userId,
plan
){

const days =
getPlanDays(plan);

const expires =
new Date();

expires.setDate(
expires.getDate()+days
);


/*
phone نییە
*/

const {error} =
await supabaseClient
.from("profiles")
.upsert({

id:userId,

premium_active:true,

premium_plan:plan,

premium_expires_at:
expires.toISOString()

},{
onConflict:"id"
});

if(error){

console.error(
"PREMIUM UPDATE ERROR:",
error
);

return {
success:false,
error:error.message
};

}


/*
دووبارە profile بخوێنەوە
*/

const {data,error:readError} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",userId)
.maybeSingle();

if(readError){

return {
success:false,
error:readError.message
};

}

if(!data){

return {
success:false,
error:"Profile ـی بەکارهێنەر نەدۆزرایەوە."
};

}

return {
success:true,
data:data
};

}


/* =========================
ACCEPT PAYMENT
========================= */

async function acceptPayment(
paymentId,
userId,
plan
){

if(!isAdmin()){

alert(
"❌ تەنها Admin دەتوانێت."
);

return;

}

const ok =
confirm(
"ئایا دڵنیایت لە پەسەندکردنی ئەم داواکارییە؟"
);

if(!ok)
return;


/*
سەرەتا Premium
*/

const premiumResult =
await activateUserPremium(
userId,
plan
);

if(!premiumResult.success){

alert(
"❌ وەسڵەکە پەسەند نەکرا، چونکە Premium چالاک نەکرا.\n\n"+
premiumResult.error
);

return;

}


/*
دواتر accepted
*/

const {error:paymentError} =
await supabaseClient
.from("payment_requests")
.update({
status:"accepted"
})
.eq("id",paymentId);

if(paymentError){

alert(
"❌ Premium چالاک بوو، بەڵام دۆخی وەسڵ نەگۆڕدرا:\n\n"+
paymentError.message
);

return;

}

alert(
"✅ وەسڵەکە پەسەند کرا!\n\n"+
"👑 Premium ـی بەکارهێنەر چالاک کرا.\n\n"+
"پلان: "+plan
);

await loadAdminRequests();

}


/* =========================
REJECT
========================= */

async function rejectPayment(
paymentId
){

if(!isAdmin()){

alert(
"❌ تەنها Admin دەتوانێت."
);

return;

}

if(!confirm(
"ئایا دڵنیایت لە ڕەتکردنەوەی ئەم داواکارییە؟"
))
return;

const {error} =
await supabaseClient
.from("payment_requests")
.update({
status:"rejected"
})
.eq("id",paymentId);

if(error){

alert(
"❌ ڕەتکردنەوە سەرکەوتوو نەبوو:\n\n"+
error.message
);

return;

}

alert(
"❌ داواکارییەکە ڕەتکرایەوە."
);

await loadAdminRequests();

}

/* =========================
CHOOSE PLAN
========================= */

async function choosePlan(
plan,
price
){

if(!currentUser){

alert(

);

}

selectedPlan=plan;

/*
ADMIN = FREE
*/

NORMAL USER
*/

.value=

currentUser.user_metadata?.full_name ||
"";

.value=
currentUser.user_metadata?.phone ||
"";

document.getElementById("receiptImage")
.value="";

document.getElementById("message")
.value="";

.style.display="block";

document.getElementById("paymentSuccess")

/* =========================
SEND PAYMENT
========================= */

async function sendPayment(){

if(!currentUser){

alert(
"❌ تکایە Login بکە."
);

return;

}

if(isAdmin()){

alert(
"👑 تۆ Admin ـیت.\n\n"+
"Premium ـەکەت بێ پارەدان چالاک دەکرێت."
);

return;

}

if(!selectedPlan){

alert(
"❌ تکایە پلانێک هەڵبژێرە."
);

return;

}

const name =
document.getElementById("userName")
.value.trim();

const phone =
document.getElementById("userPhone")
.value.trim();

const file =
document.getElementById("receiptImage")
.files[0];

if(!name || !phone){

alert(
"❌ تکایە ناو و ژمارەی مۆبایل پڕ بکەرەوە."
);

return;

}

if(!file){

alert(
"❌ تکایە وێنەی وەسڵ دابنێ."
);

return;

}

if(file.size>5*1024*1024){

alert(
"❌ قەبارەی وێنەکە زۆرە. کەمتر لە 5MB بێت."
);

return;

}

try{

const extension =
file.name
.split(".")
.pop()
.toLowerCase();

const fileName =
currentUser.id+
"_"+Date.now()+
"."+extension;

const {error:uploadError} =
await supabaseClient
.storage
.from("receipts")
.upload(
fileName,
file,
{
cacheControl:"3600",
upsert:false,
contentType:file.type
}
);

if(uploadError){

alert(
"❌ ناردنی وەسڵ سەرکەوتوو نەبوو:\n\n"+
uploadError.message
);

return;

}

const {data:urlData} =
supabaseClient
.storage
.from("receipts")
.getPublicUrl(fileName);

const receiptUrl =
urlData?.publicUrl || "";

if(!receiptUrl){

alert(
"❌ لینکی وەسڵ دروست نەکرا."
);

return;

}


/*
phone لە payment_requests ـیش نانێرین.
*/

const paymentData = {

user_id:currentUser.id,

plan:selectedPlan,

amount:selectedPrice,

receipt_url:receiptUrl,

status:"pending"

};

const {error} =
await supabaseClient
.from("payment_requests")
.insert(paymentData);

if(error){

alert(
"❌ داواکارییەکە نەنێردرا:\n\n"+
error.message
);

return;

}

document.getElementById("paymentForm")
.style.display="none";

document.getElementById("paymentSuccess")
.style.display="block";

await loadMyPayments();

}catch(error){

alert(
"❌ هەڵەیەک ڕوویدا:\n\n"+
(error.message || error)
);

}

}


/* =========================
USER PAYMENTS
========================= */

async function loadMyPayments(){

const box =
document.getElementById("myPayments");

if(!currentUser)
return;

const {data,error} =
await supabaseClient
.from("payment_requests")
.select("*")
.eq("user_id",currentUser.id)
.order(
"created_at",
{ascending:false}
);

if(error){

console.error(error);

box.innerHTML="";

return;

}

if(!data || data.length===0){

box.innerHTML =
"<p style='color:#777'>هیچ داواکارییەکت نییە.</p>";

return;

}

let html =
"<h3 style='margin-bottom:12px'>📋 داواکارییەکانت</h3>";

data.forEach(item=>{

let status="⏳ چاوەڕوان";

if(item.status==="accepted")
status="✅ پەسەندکراو";

if(item.status==="rejected")
status="❌ ڕەتکرایەوە";

html +=
"<div class='payment-item'>"+
"<strong>پلان:</strong> "+
escapeHTML(item.plan || "")+
"<br>"+
"<strong>بڕ:</strong> "+
escapeHTML(item.amount || "")+
" د.ع"+
"<br>"+
"<strong>دۆخ:</strong> "+
status+
"</div>";

});

box.innerHTML=html;

}


/* =========================
LOGOUT
========================= */

async function logout(){

const answer =
confirm(
"🚪 ئایا دڵنیایت لە چوونەدەرەوە؟"
);

if(!answer)
return;

const {error} =
await supabaseClient.auth.signOut();

if(error){

alert(
"❌ چوونەدەرەوە سەرکەوتوو نەبوو:\n\n"+
error.message
);

return;

}

currentUser=null;
currentProfile=null;

document.getElementById("dashboard")
.style.display="none";

updateHeader();

}


/* =========================
SCROLL
========================= */

function scrollToPlans(){

document.getElementById("plans")
.scrollIntoView({
behavior:"smooth"
});

}


/* =========================
MODAL CLICK
========================= */

document.addEventListener(
"click",
function(e){

if(e.target.classList.contains("modal"))
e.target.style.display="none";

}
);


/* =========================
AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
(event,session)=>{

if(session?.user){

currentUser=session.user;

updateHeader();

setTimeout(async()=>{

await loadProfile();
await showDashboard();

},100);

}else{

currentUser=null;
currentProfile=null;

updateHeader();

document.getElementById("dashboard")
.style.display="none";

}

}
);


/* =========================
START
========================= */

async function startApp(){

const {data} =
await supabaseClient.auth.getSession();

if(data?.session?.user){

currentUser =
data.session.user;

await loadProfile();

updateHeader();

await showDashboard();

}else{

currentUser=null;
currentProfile=null;

updateHeader();

}

}

startApp();

</script>
